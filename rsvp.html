<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RSVP</title>

  <meta name="description" content="Confirmez votre présence au mariage.">

  <!-- ================= POLICES ================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- ================= CSS ================= -->

  <link
    rel="stylesheet"
    href="css/variables.css"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

</head>


<body>

<section class="rsvp-page">

  <div class="rsvp-card">

    <div class="divider">
      <div class="line"></div>

      <div class="seal">
        <span class="seal-initials" id="sealInitials"></span>
      </div>

      <div class="line"></div>
    </div>


    <h1>Confirmez votre présence</h1>


    <p class="rsvp-sub">
      Votre présence est le plus beau des cadeaux.
      Merci de confirmer votre participation.
    </p>


    <form class="rsvp-form">

      <div class="form-group">
        <label for="name">Nom</label>

        <input 
          id="name"
          type="text"
          placeholder="Votre nom complet"
          required>
      </div>


      <div class="form-group">
        <label for="email">Courriel</label>

        <input
          id="email"
          type="email"
          placeholder="Votre courriel"
          required>
      </div>


      <div class="form-group">

        <label>Présence</label>

        <div class="radio-options">

          <label>
            <input 
              type="radio"
              name="presence"
              value="Oui, je serai présent(e)"
              required>
            Oui, je serai présent(e)
          </label>


          <label>
            <input 
              type="radio"
              name="presence"
              value="Non, je ne pourrai pas venir">
            Non, je ne pourrai pas venir
          </label>

        </div>

      </div>


      <div class="form-group">

        <label for="message">Message</label>

        <textarea 
          id="message"
          rows="4"
          placeholder="Un petit mot pour les mariés..."></textarea>

      </div>


      <div class="form-group" id="invitesGroup" style="display:none;">
        <label for="invites">Nombre de personnes (vous inclus)</label>

        <select id="invites"></select>
      </div>


      <button class="rsvp-btn" type="submit">
        Envoyer ma réponse
      </button>


    </form>


    <p class="rsvp-deadline" id="rsvpDeadline"></p>


  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/config.js"></script>
<script src="js/rsvp.js"></script>

</body>

</html>
