<body>

<section class="rsvp-page">

  <div class="rsvp-card">

    <div class="divider">
      <div class="line"></div>

      <div class="seal">
        <span class="seal-initials">S&amp;C</span>
      </div>

      <div class="line"></div>
    </div>


    <h1>Confirmez votre présence</h1>


    <p class="rsvp-sub">
      Votre présence est le plus beau des cadeaux.
      Merci de confirmer votre participation.
    </p>


    <form class="rsvp-form">

      <div class="form-group">
        <label for="name">Nom</label>

        <input 
          id="name"
          type="text"
          placeholder="Votre nom complet"
          required>
      </div>


      <div class="form-group">

        <label>Présence</label>

        <div class="radio-options">

          <label>
            <input 
              type="radio"
              name="presence"
              value="Oui, je serai présent(e)"
              required>
            Oui, je serai présent(e)
          </label>


          <label>
            <input 
              type="radio"
              name="presence"
              value="Non, je ne pourrai pas venir">
            Non, je ne pourrai pas venir
          </label>

        </div>

      </div>


      <div class="form-group">

        <label for="message">Message</label>

        <textarea 
          id="message"
          rows="4"
          placeholder="Un petit mot pour les mariés..."></textarea>

      </div>


      <button class="rsvp-btn" type="submit">
        Envoyer ma réponse
      </button>


    </form>


    <p class="rsvp-deadline">
      Merci de répondre avant le 1er août 2026
    </p>


  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/rsvp.js"></script>

</body>
